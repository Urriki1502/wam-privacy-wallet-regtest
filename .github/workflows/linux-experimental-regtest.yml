name: Linux x86_64 experimental developer Core REGTEST
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'tests/acceptance/issue45.json'
      - 'tests/test_q01*.py'
      - 'tests/test_q03*.py'
      - 'tests/test_q_gate_ledger.py'
      - 'src/wam_regtest/q_gate.py'
      - 'scripts/q01_*.py'
      - 'requirements/q01-*.lock'
      - '.github/workflows/linux-experimental-regtest.yml'
      - 'scripts/build_linux_developer_core.sh'
      - 'scripts/build_linux_wallet.py'
      - 'scripts/linux_headless_acceptance.py'
      - 'src/wam_regtest/*.py'
      - 'tests/test_v1_k07_real_git_source.py'
      - 'tests/test_v1_wsp_execution.py'
      - 'tests/test_linux*.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      core_changed: ${{ steps.scope.outputs.core_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Q01 clean hash-locked headless environment
        env:
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -I scripts/q01_environment.py --profile headless --environment "${{ runner.temp }}/q01-env" --receipt q01-install.json
      - name: Q01 native missing-dependency refusal (no Core execution)
        run: python scripts/q01_dependency_negatives.py
      - name: Native headless contracts and immutable build-input scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WAM_ROOT_WITNESS_NATIVE_TESTS: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y acl
          python -m unittest discover -s tests -p 'test_v1_k07_real_git_source.py' -v
          python -m unittest discover -s tests -p 'test_v1_wsp_execution.py' -v
          python -m unittest discover -s tests -p 'test_q01*.py' -v
          python -m unittest discover -s tests -p 'test_q02*.py' -v
          python -m unittest discover -s tests -p 'test_q03*.py' -v
          python -m unittest discover -s tests -p 'test_q_gate_ledger.py' -v
          python -m unittest discover -s tests -p 'test_linux*.py' -v
          python - <<'PY'
          import os,subprocess
          base=os.environ.get('BASE_SHA')
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines() if base else []
          inputs={'.github/workflows/linux-experimental-regtest.yml','scripts/build_linux_developer_core.sh','src/wam_regtest/linux_developer_core.py','src/wam_regtest/linux_core_probe.py','src/wam_regtest/core.py','tests/test_linux_developer_core.py'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('core_changed='+str(not base or bool(inputs.intersection(changed))).lower()+'\n')
          PY
      - name: Preserve Q01 source-install receipt (not Q acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q01-install-linux-experimental-regtest-native-contracts-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            q01-install.json
            q01-dependency-negatives.json
            q01-core-negatives.json
          if-no-files-found: warn
          retention-days: 14
  headless-wallet:
    needs: native-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Q01 clean hash-locked wallet environment
        env:
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -I scripts/q01_environment.py --profile headless --environment "${{ runner.temp }}/q01-env" --receipt q01-install.json
      - name: Q01 native missing-dependency refusal (no Core execution)
        run: python scripts/q01_dependency_negatives.py
      - name: Fetch previously qualified immutable developer Core artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-developer-core-576082d227ccd9eb139686ded431c69c07399237
          run-id: 38697805476
          github-token: ${{ github.token }}
          path: qualified-linux-core
      - name: Native headless dependency closure and actual wallet executable
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libevent-dev libsqlite3-dev binutils
          chmod 700 qualified-linux-core/linux-core/wamd qualified-linux-core/linux-core/wam-cli
          python scripts/q01_core_negatives.py --core-dir qualified-linux-core/linux-core --output q01-core-negatives.json
          python scripts/linux_headless_acceptance.py --core-dir qualified-linux-core/linux-core
      - uses: actions/upload-artifact@v4
        with:
          name: linux-headless-wallet-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: linux-headless-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Q01 source-install receipt (not Q acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q01-install-linux-experimental-regtest-headless-wallet-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            q01-install.json
            q01-dependency-negatives.json
            q01-core-negatives.json
          if-no-files-found: warn
          retention-days: 14
  native-qt-wallet:
    needs: native-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Q01 clean hash-locked wallet environment
        env:
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -I scripts/q01_environment.py --profile gui --environment "${{ runner.temp }}/q01-env" --receipt q01-install.json
      - name: Q01 native missing-dependency refusal (no Core execution)
        run: python scripts/q01_dependency_negatives.py
      - name: Fetch previously qualified immutable developer Core artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-developer-core-576082d227ccd9eb139686ded431c69c07399237
          run-id: 38697805476
          github-token: ${{ github.token }}
          path: qualified-linux-core
      - name: Native xcb Qt over actual Core and independent root witness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libevent-dev libsqlite3-dev binutils xvfb xauth libegl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libdbus-1-3 fonts-noto-core
          chmod 700 qualified-linux-core/linux-core/wamd qualified-linux-core/linux-core/wam-cli
          python scripts/q01_core_negatives.py --core-dir qualified-linux-core/linux-core --output q01-core-negatives.json
          python - <<'PYQT'
          from pathlib import Path
          import PySide6,subprocess
          plugin=Path(PySide6.__file__).parent/'Qt/plugins/platforms/libqxcb.so'
          result=subprocess.check_output(['/usr/bin/ldd',str(plugin)],text=True)
          print(result)
          assert 'not found' not in result,'NATIVE_QT_XCB_DEPENDENCY_UNAVAILABLE'
          PYQT
          QT_QPA_PLATFORM=xcb xvfb-run -a python scripts/linux_headless_acceptance.py --core-dir qualified-linux-core/linux-core --qt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-qt-wallet-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            linux-qt-evidence.json
            fusion-ui-review/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Q01 source-install receipt (not Q acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q01-install-linux-experimental-regtest-native-qt-wallet-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            q01-install.json
            q01-dependency-negatives.json
            q01-core-negatives.json
          if-no-files-found: warn
          retention-days: 14
  frozen-wallet:
    needs: [headless-wallet, native-qt-wallet]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        frontend: [headless, desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Q01 clean hash-locked wallet environment
        env:
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -I scripts/q01_environment.py --profile ${{ matrix.frontend == 'desktop' && 'gui' || 'headless' }} --environment "${{ runner.temp }}/q01-env" --receipt q01-install.json
      - name: Q01 native missing-dependency refusal (no Core execution)
        run: python scripts/q01_dependency_negatives.py
      - uses: actions/download-artifact@v4
        with:
          name: linux-developer-core-576082d227ccd9eb139686ded431c69c07399237
          run-id: 38697805476
          github-token: ${{ github.token }}
          path: qualified-linux-core
      - name: Native dependencies and pinned source closure
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libevent-dev libsqlite3-dev binutils
          chmod 700 qualified-linux-core/linux-core/wamd qualified-linux-core/linux-core/wam-cli
          python scripts/q01_core_negatives.py --core-dir qualified-linux-core/linux-core --output q01-core-negatives.json
      - name: Native desktop dependency closure
        if: matrix.frontend == 'desktop'
        run: |
          sudo apt-get install -y xvfb xauth libegl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libdbus-1-3 fonts-noto-core
      - name: Freeze and execute FINAL headless binary with real Core
        if: matrix.frontend == 'headless'
        env:
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -I scripts/build_linux_wallet.py --core-dir qualified-linux-core/linux-core
      - name: Freeze and execute FINAL native xcb desktop binary with real Core
        if: matrix.frontend == 'desktop'
        env:
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a python -I scripts/build_linux_wallet.py --core-dir qualified-linux-core/linux-core --desktop
      - uses: actions/upload-artifact@v4
        with:
          name: WAM-Fusion-REGTEST-RC1-linux-x86_64-${{ matrix.frontend }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            linux-package-output/
            fusion-ui-review/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Q01 source-install receipt (not Q acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q01-install-linux-experimental-regtest-frozen-wallet-${{ matrix.frontend }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            q01-install.json
            q01-dependency-negatives.json
            q01-core-negatives.json
          if-no-files-found: warn
          retention-days: 14
  developer-core:
    needs: native-contracts
    if: needs.native-contracts.outputs.core_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/checkout@v4
        with:
          repository: wamcoin-core-dev/wam-coin
          ref: 82a1487fd86f7021b1b9fc1524d267fca126f7d4
          path: linux-upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bitcoin/bitcoin
          ref: 32efe850438ef22e2de39e562af557872a402c31
          path: linux-upstream/build/wam-core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tevador/RandomX
          ref: 102f8acf90a7649ada410de5499a7ec62e49e1da
          path: linux-upstream/build/randomx
          persist-credentials: false
      - name: Native Linux prerequisites and parser contracts
        run: |
          test "$(uname -sm)" = 'Linux x86_64'
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config bsdmainutils cmake libevent-dev libboost-dev libssl-dev libsqlite3-dev binutils
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_linux_developer_core.py' -v
      - name: Build exact upstream sources and refuse executable GNU_STACK
        run: bash scripts/build_linux_developer_core.sh
      - name: Actual developer Core REGTEST 101 blocks and process cleanup
        run: |
          python -m wam_regtest.linux_core_probe --core-dir linux-core \
            --manifest-sha256 "$(cat LINUX_DEVELOPER_CORE_MANIFEST_SHA256.txt)" \
            --confirm-experimental-developer-regtest --report linux-core-evidence.json
      - name: Publish experimental Core bytes and public trust receipt only
        uses: actions/upload-artifact@v4
        with:
          name: linux-developer-core-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            linux-core/
            LINUX_DEVELOPER_CORE_MANIFEST_SHA256.txt
            linux-core-evidence.json
          retention-days: 14
          if-no-files-found: error
