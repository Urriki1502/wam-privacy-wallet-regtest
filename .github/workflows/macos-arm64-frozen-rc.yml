# Review-only macOS ARM64 package.
# verify_source requires GITHUB_SHA to equal git HEAD, and GitHub ignores
# overrides of GITHUB_* variables. This job therefore builds the workflow
# commit itself. That commit must differ from the frozen functional pin
# only by this file. Wallet Python is not edited here.
# It does not merge, release, or claim Q06 acceptance.
name: WAM Fusion macOS ARM64 frozen RC

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1-net-shared-regtest-20261104
    paths:
      - .github/workflows/macos-arm64-frozen-rc.yml

permissions:
  contents: read

concurrency:
  group: macos-arm64-frozen-rc-official-v013
  cancel-in-progress: false

jobs:
  macos-arm64-frozen-rc:
    name: Build and qualify frozen macOS ARM64 app and DMG
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      WAM_SOURCE_HEAD: ${{ github.sha }}
      FUNCTIONAL_PIN: c61e3c5be4b8519dc6c4d9eb56d124fce84cf02d
      WSP_PIN: ac55f13423620252bdbf848c7e8a280c3b84721e
    steps:
      - name: Check out this review commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Require Apple Silicon and a workflow-only diff from the pin
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "$WAM_SOURCE_HEAD"
          git merge-base --is-ancestor "$FUNCTIONAL_PIN" HEAD
          echo "MACOS_ARM64_RUNNER_PASS"
          echo "FUNCTIONAL_PIN_IS_ANCESTOR $FUNCTIONAL_PIN"

      - name: Check out pinned WSP source
        uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-upstream
          persist-credentials: false

      - name: Require the WSP pin
        run: test "$(git -C wsp-upstream rev-parse HEAD)" = "$WSP_PIN"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: arm64

      - name: Install GnuPG for the official Core signature check
        run: |
          set -euo pipefail
          if ! command -v gpg >/dev/null; then brew install gnupg; fi
          command -v gpg
          gpg --version

      - name: Hash-locked GUI environment
        run: python -I scripts/q01_environment.py --profile gui --environment "${{ runner.temp }}/q01-env" --receipt q01-install.json

      - name: Fetch official signed WAM Core v0.1.13 and check identities
        run: |
          set -euo pipefail
          python -I -m wam_regtest.release --platform macos-arm64 --destination "$PWD/core"
          python -I - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected = {
              "wamd": "fe04a61f17eb8047f1d2a537ebcb61b45cbde14c491bc332d2a2ab7ee18237ba",
              "wam-cli": "2b19fdac692cbed5810b6fa9663ac89f25ab8f346da84c5fd13bf2b8535e3e19",
          }
          for name, digest in expected.items():
              got = sha256((Path("core") / name).read_bytes()).hexdigest()
              if got != digest:
                  raise SystemExit("MACOS_OFFICIAL_CORE_SHA_DENIED")
          print("MACOS_OFFICIAL_CORE_SHA256_PASS")
          PY

      - name: Build, qualify, and package
        run: bash scripts/build_macos_bundle.sh

      - name: Independently hash the packages and write the download note
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          pin = os.environ["FUNCTIONAL_PIN"]
          built = os.environ["WORKFLOW_SHA"]
          local_dmg = "a77337b612fe9c9b2d9f5725ca7cf86c029172cfc869fa1b04c31503570e2d2c"
          out = Path("package-output")
          receipt = json.loads((out / "SHA256SUMS.json").read_text())
          if receipt.get("source_commit") != built:
              raise SystemExit("MACOS_RC_SOURCE_COMMIT_DENIED")
          if receipt.get("mainnet_allowed") is not False:
              raise SystemExit("MACOS_RC_MAINNET_DENIED")
          if receipt.get("qualification_scope") != "full":
              raise SystemExit("MACOS_RC_SCOPE_DENIED")
          if receipt.get("full_exact_commit_Q01_Q06_qualified") is not True:
              raise SystemExit("MACOS_RC_QUALIFICATION_FLAG_DENIED")
          if receipt.get("status") != "UNNOTARIZED_REAL_REGTEST_MACOS_ARM64_PREVIEW":
              raise SystemExit("MACOS_RC_SIGNING_STATUS_DENIED")
          if receipt.get("wamd_sha256") != "fe04a61f17eb8047f1d2a537ebcb61b45cbde14c491bc332d2a2ab7ee18237ba":
              raise SystemExit("MACOS_RC_WAMD_DENIED")
          if receipt.get("wam_cli_sha256") != "2b19fdac692cbed5810b6fa9663ac89f25ab8f346da84c5fd13bf2b8535e3e19":
              raise SystemExit("MACOS_RC_WAM_CLI_DENIED")
          names = (
              "WAM-Privacy-Wallet-REGTEST-macOS-ARM64.dmg",
              "WAM-Privacy-Wallet-REGTEST-macOS-ARM64.app.zip",
          )
          lines = []
          publish = Path("macos-rc-publish")
          publish.mkdir(mode=0o700)
          for name in names:
              blob = (out / name).read_bytes()
              digest = hashlib.sha256(blob).hexdigest()
              recorded = receipt["files"][name]["sha256"]
              if digest != recorded:
                  raise SystemExit("MACOS_RC_INDEPENDENT_HASH_MISMATCH")
              (publish / name).write_bytes(blob)
              lines.append(f"{digest}  {name}")
              print(f"INDEPENDENT_SHA256 {name} {digest}")
              if name.endswith(".dmg") and digest == local_dmg:
                  print("HOSTED_DMG_MATCHES_LOCAL_BUILD")
              elif name.endswith(".dmg"):
                  print("HOSTED_DMG_DIFFERS_FROM_LOCAL_BUILD")
          (publish / "SHA256SUMS").write_text("\n".join(lines) + "\n")
          (publish / "SHA256SUMS.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          (publish / "README.txt").write_text(
              "WAM Fusion REGTEST — macOS ARM64 review package\n"
              "\n"
              "This is a review-only REGTEST build. It is not a GitHub Release,\n"
              "not mainnet, and not Q06 acceptance.\n"
              "\n"
              f"Git commit built by this job: {built}\n"
              f"Functional ancestor pin: {pin}\n"
              "The package manifest source_commit is this job's git commit.\n"
              "Do not relabel it as an older local DMG or as 56ea3618.\n"
              "\n"
              "Branch: feature/official-core-v013-three-platform-20261105\n"
              "WSP pin: ac55f13423620252bdbf848c7e8a280c3b84721e\n"
              "Official Core: WAM Core v0.1.13 ARM64\n"
              "wamd: fe04a61f17eb8047f1d2a537ebcb61b45cbde14c491bc332d2a2ab7ee18237ba\n"
              "wam-cli: 2b19fdac692cbed5810b6fa9663ac89f25ab8f346da84c5fd13bf2b8535e3e19\n"
              "\n"
              "Signing: the Fusion app is ad-hoc signed (codesign --sign -).\n"
              "It is not Developer ID signed and not notarized. Gatekeeper may\n"
              "warn. Do not disable system protections. The bundled Core bytes\n"
              "are the official v0.1.13 hashes above.\n"
              "\n"
              "Install: unzip this artifact, open the .dmg, and copy the app out.\n"
              "Or unzip the .app.zip. Use a new disposable REGTEST profile.\n"
              "Do not open an existing Desktop wallet.\n"
              "\n"
              "Test: create and restore a 12-word wallet, receive on REGTEST,\n"
              "then Sign and Broadcast as two separate approvals and confirm\n"
              "after one block. History, balance, and reopen must agree.\n"
              "V1-V18 are part of the frozen qualification on one machine.\n"
              "V19 needs two physical computers and is not passed here.\n"
              "\n"
              "SHA256SUMS was hashed again after the builder wrote\n"
              "SHA256SUMS.json. Use these hashes, not an older local DMG hash,\n"
              "unless the files actually match.\n"
              "Q06 accepted=false. G6 and G7 are not accepted here.\n",
              encoding="utf-8",
          )
          # Publish bounded public receipts as well as the payloads. No
          # profiles, encrypted vaults, cookies or test keychains are copied.
          import shutil
          for path in out.iterdir():
              if path.is_file() and not path.is_symlink() and path.suffix == '.json':
                  if path.stat().st_size > 8 * 1024 * 1024:
                      raise SystemExit("MACOS_PUBLIC_RECEIPT_SIZE_DENIED")
                  if path.name != 'SHA256SUMS.json':
                      shutil.copyfile(path, publish / path.name)
          from wam_regtest.release_candidate import write_portable_sha256sums
          write_portable_sha256sums(publish)
          print("MACOS_RC_PUBLISH_TREE_PASS")
          PY

      - name: Upload the DMG, app zip, checksums, and README
        uses: actions/upload-artifact@v4
        with:
          name: WAM-Fusion-REGTEST-macos-arm64-${{ github.sha }}
          path: macos-rc-publish/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
