name: REAL Windows x64 WAM Core + WSP BIP352 confirmed receive

on:
  push:
    branches:
      - cursor/q05-history-pagination-9c81
    paths:
      - "src/wam_regtest/windows_wsp_regtest.py"
      - "src/wam_regtest/windows_core_regtest_smoke.py"
      - "src/wam_regtest/q05_owned_lifecycle.py"
      - "src/wam_regtest/wallet_session.py"
      - "scripts/probe_q05_owned_session.py"
      - "tests/test_windows_wsp_regtest.py"
      - ".github/workflows/windows-x64-wsp-real-receive.yml"
  pull_request:
    paths:
      - "src/wam_regtest/windows_wsp_regtest.py"
      - "src/wam_regtest/windows_core_regtest_smoke.py"
      - "src/wam_regtest/q05_owned_lifecycle.py"
      - "src/wam_regtest/wallet_session.py"
      - "scripts/probe_q05_owned_session.py"
      - "tests/test_windows_wsp_regtest.py"
      - ".github/workflows/windows-x64-wsp-real-receive.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-wsp-core-e2e:
    name: Signed Core + real WSP BIP352 receive / SQLite restart
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Strict native Windows and exact pinned WSP
        shell: pwsh
        run: |
          python -c "import os,platform,struct; assert os.name=='nt' and platform.machine().lower() in ('amd64','x86_64') and struct.calcsize('P')==8"
          $head = git -C wsp-upstream rev-parse HEAD
          if ($head.Trim() -ne "ac55f13423620252bdbf848c7e8a280c3b84721e") { throw "WSP_PIN_DENIED" }
          if (!(Get-Command gpg -ErrorAction SilentlyContinue)) { throw "SIGNED_CORE_GPG_REQUIRED" }
      - name: Install real pinned engine + wallet and negative tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e . -e ./wsp-upstream
          python -m pip check
          python -m unittest discover -s tests -p "test_windows_wsp_regtest.py" -v
          if ($LASTEXITCODE -ne 0) { throw "WIN_WSP_BRIDGE_CONTRACT_DENIED" }
      - name: Execute genuine Core regtest and native WSP BIP352 receive/SQLite
        shell: pwsh
        run: |
          @'
          import tempfile
          from pathlib import Path
          from wam_regtest.release import _download_exact
          from wam_regtest.windows_core_regtest_smoke import smoke_signed_windows_regtest
          from wam_regtest.windows_release_preflight import ASSET

          source=Path("wsp-upstream").absolute()
          with tempfile.TemporaryDirectory(prefix="wam-win-wsp-e2e-") as temp:
              root=Path(temp)
              for remote,name,limit in (
                  ("/SIGNING-KEY.asc","SIGNING-KEY.asc",32768),
                  ("/downloads/v0.1.11/SHA256SUMS","SHA256SUMS",131072),
                  ("/downloads/v0.1.11/SHA256SUMS.asc","SHA256SUMS.asc",16384),
                  ("/downloads/v0.1.11/"+ASSET,ASSET,320*1024*1024),
              ):
                  _download_exact(remote,limit,root/name)
              evidence=smoke_signed_windows_regtest(
                  root/ASSET,root/"SIGNING-KEY.asc",root/"SHA256SUMS",
                  root/"SHA256SUMS.asc", consent=True,
                  wsp_source=source, confirm_public_fixture_payment=True)
              assert evidence["status"]=="WIN64_REAL_CORE_WSP1_BIP352_CONFIRMED_RECEIVE_PASS"
              assert evidence["wsp_bip352_payment_e2e"] is True
              assert evidence["wsp_receipt"]["real_onchain_payment"] is True
              assert evidence["wsp_receipt"]["scanner_sqlite_history"] is True
              assert evidence["wsp_receipt"]["scanner_restart_no_double_credit"] is True
              for forbidden in ("sign_broadcast_authorized","production_authorized","mainnet_allowed"):
                  assert evidence[forbidden] is False, "WIN_E2E_FORBIDDEN_AUTHORITY"
              print("WIN64_ACTUAL_SIGNED_CORE_WSP_BIP352_RECEIVE_SQLITE_E2E_PASS")
              print("CONFIRM_BLOCK_HEIGHT",evidence["wsp_receipt"]["confirm_height"])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "WIN_REAL_CORE_WSP_BIP352_E2E_DENIED" }

  q05-owned-session-funded:
    name: Q05 owned-session funded BIP352 sign/broadcast on signed Windows Core
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Native Windows x64, GPG and pinned WSP
        shell: pwsh
        run: |
          python -c "import os,platform,struct; assert os.name=='nt' and platform.machine().lower() in ('amd64','x86_64') and struct.calcsize('P')==8"
          $head = git -C wsp-upstream rev-parse HEAD
          if ($head.Trim() -ne "ac55f13423620252bdbf848c7e8a280c3b84721e") { throw "WSP_PIN_DENIED" }
          if (!(Get-Command gpg -ErrorAction SilentlyContinue)) { throw "WIN_GPG_REQUIRED" }
      - name: Install wallet and pinned WSP
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[gui]" -e ./wsp-upstream
          python -m pip check
      - name: Stage official signed Windows Core
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from wam_regtest.q05_owned_lifecycle import stage_windows_core; stage_windows_core(Path('core').resolve())"
          if ($LASTEXITCODE -ne 0) { throw "WIN_Q05_CORE_STAGE_DENIED" }
      - name: Q05 funded owned-session BIP352 + sign/broadcast
        shell: pwsh
        env:
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/probe_q05_owned_session.py --core-dir (Resolve-Path core) --wsp-source (Resolve-Path wsp-upstream) --root "$env:RUNNER_TEMP\q05-owned-funded" --receipt q05-owned-session-funded.json --confirm-disposable-regtest --fund-disposable-wallet --confirm-gui-lifecycle --skip-fail-closed
          if ($LASTEXITCODE -ne 0) { throw "WIN_Q05_FUNDED_OWNED_DENIED" }
          python -c "import json; from pathlib import Path; p=json.loads(Path('q05-owned-session-funded.json').read_text()); assert p['status']=='PASS' and p['fixture_funding'] is True and p['mainnet_allowed'] is False and p['scenarios']['sign_broadcast']=='PASS' and p['scenarios']['concurrent_owner_refused']=='PASS' and p['scenarios']['same_owner_reattach']=='PASS' and p['scenarios']['graceful_shutdown']=='PASS' and p['scenarios']['funded_same_owner_crash_recovery']=='PASS' and p['scenarios']['native_gui']=='PASS' and any(row.get('history_identity_unchanged') for row in p['observations']) and any(row.get('reservation_identity_unchanged') is True for row in p['observations']) and any(row.get('native_gui_history_matches') is True and row.get('gui_history_count',0)>=2 and row.get('automatic_wallet_transaction_replay') is False for row in p['observations']) and p['automatic_wallet_transaction_replay'] is False; print('Q05_WINDOWS_OWNED_SESSION_FUNDED_PASS')"
      - name: Upload Q05 Windows funded owned-session receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q05-owned-session-funded-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: q05-owned-session-funded.json
          if-no-files-found: warn
          retention-days: 14
