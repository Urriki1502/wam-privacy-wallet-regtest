name: REAL WAM Core v0.1.11 REGTEST (macOS ARM64)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-wamd:
    name: Real signed Core → WSP BIP352 → native Qt Receive Balance History
    runs-on: macos-15
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable WSP-1 upstream source
        uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'
      - name: Require actual Apple Silicon hardware
        run: test "$(uname -m)" = arm64
      - name: Setup official GnuPG verifier
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gpg >/dev/null; then brew install gnupg; fi
          command -v gpg
      - name: Install wallet CLI plus exact pinned native WSP scanner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C wsp-upstream rev-parse HEAD)" = ac55f13423620252bdbf848c7e8a280c3b84721e
          python -m pip install --disable-pip-version-check -e '.[gui]' -e ./wsp-upstream
          python -m pip check
      - name: Run fail-closed unit contracts (not E2E)
        run: python -X faulthandler scripts/run_native_unittest.py --pattern 'test*.py'
      - name: Compile unchanged pinned WAM subsidy source vectors (not Core E2E)
        run: python scripts/check_wam_subsidy_source.py --output source-subsidy-contract.json
      - name: Fetch pinned official signed ARM64 Core (SHA-256 + GPG)
        run: python -m wam_regtest.release --platform macos-arm64 --destination core
      - name: T05 real persistent Core + actual Fusion GUI close/reopen (wallet continuity pending)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/issue45_t05_real_core.py --core-dir core --qt-e2e --output t05-real-core-evidence.json
      - name: Genuine original managed WSP PSBTv2 send and confirmation through owned Core
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/issue45_managed_spend_e2e.py --core-dir core --wsp-source wsp-upstream --output managed-spend-real-core-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('managed-spend-real-core-evidence.json').read_text())
          assert p['status']=='MANAGED_ORIGINAL_WSP_REAL_SPEND_E2E_PASS'
          for field in ('real_confirmed_bip352_funding','genuine_wsp_psbtv2_native_signature',
                        'send_via_authenticated_owned_http',
                        't01_managed_reads_without_cli_or_binary_rehash',
                        't02_scoped_ipc_cross_authority_real_supervisor_denied',
                        'signed_reservation_anchored_before_crypto',
                        'broadcast_reservation_persisted_before_rpc',
                        'exact_original_identity_after_close_reopen',
                        'real_core_mempool_and_confirmed',
                        'actual_native_fusion_qt_send_sign_broadcast'):
              assert p[field] is True,field
          assert p['unattended_broadcast_retry'] is False
          assert p['mainnet_allowed'] is False
          PY
      - name: K-03 genuine BIP39 64-byte native-vault WSP Send Sign Broadcast and reopen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/issue45_managed_spend_e2e.py --bip39 --core-dir core --wsp-source wsp-upstream --output k03-bip39-native-core-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          proof=json.loads(Path("k03-bip39-native-core-evidence.json").read_text())
          assert proof["status"]=="K03_BIP39_DURABLE_REAL_WSP_SPEND_E2E_PASS"
          for name in (
              "k03_bip39_native_seed_to_signer",
              "real_confirmed_bip352_funding",
              "genuine_wsp_psbtv2_native_signature",
              "signed_reservation_anchored_before_crypto",
              "broadcast_reservation_persisted_before_rpc",
              "exact_original_identity_after_close_reopen",
              "actual_native_fusion_qt_send_sign_broadcast",
              "real_core_mempool_and_confirmed",
          ):
              assert proof[name] is True,name
          assert proof["k03_legacy_wsp32_preserved"] is False
          assert proof["mainnet_allowed"] is False
          assert proof["synthetic_rpc"] is False
          assert proof["unattended_broadcast_retry"] is False
          PY
      - name: K-04 genuine Core-native SQLite .dat backup/restore in disposable quarantine
        run: |
          python scripts/issue45_k04_sqlite_e2e.py --core-dir core --confirm-disposable-regtest --output k04-real-core-sqlite-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("k04-real-core-sqlite-evidence.json").read_text())
          assert p["status"]=="K04_REAL_CORE_SQLITE_RESTORE_QUARANTINE_PASS"
          for name in ("sqlite_header_and_bounded_copy_verified",
                       "source_immutable","real_core_restorewallet_rpc",
                       "source_and_restored_descriptors_identical",
                       "duplicate_descriptor_identity_denied",
                       "k06_genuine_core_descriptor_owner_isolation",
                       "k06_core_duplicate_owner_refused",
                       "k06_core_keys_not_reinterpreted_as_wsp",
                       "wallet_loaded_only_inside_disposable_quarantine",
                       "original_managed_core_wallet_unmodified"):
              assert p[name] is True,name
          assert p["network"]=="regtest"
          assert p["synthetic_rpc"] is False
          assert p["wallet_spend_authorized"] is False if "wallet_spend_authorized" in p else p["fusion_signer_authorized"] is False
          assert p["mainnet_allowed"] is False
          PY
      - name: K-10 actual Core SQLite source-to-target restore in separate REGTEST daemons
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.issue45_k10_core_same_host_smoke --core-dir "$GITHUB_WORKSPACE/core" --confirm-disposable-regtest
      - name: Independently evaluate wallet security contracts
        run: python scripts/audit_wallet_security.py --root . --core core --output independent-wallet-security.json
      - name: Inspect signed node dynamic library requirements (real ARM64 bytes)
        shell: bash
        run: |
          set -euo pipefail
          # Only public dependency names; no credentials or datadir.
          otool -L core/wamd
          otool -L core/wam-cli
      - name: Launch ACTUAL WAM Core, native WSP and Qt Receive/Balance/History E2E
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m wam_regtest.cli smoke \
            --core-dir core \
            --confirm-disposable-regtest \
            --wsp-source-root wsp-upstream \
            --confirm-public-fixture-payment \
            --confirm-real-gui-e2e \
            --confirm-security-e2e \
            --confirm-wallet-e2e \
            --report real-core-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          proof=json.loads(Path('real-core-evidence.json').read_text())
          assert proof['status']=='REAL_WAM_CORE_V0_1_11_NATIVE_QT_WALLET_E2E_PASS'
          assert proof['chain']=='regtest' and proof['block_height']==105
          assert proof['live_wamd_process_observed'] is True
          assert proof['live_rpc_observed'] is True
          # T-09 native signed WAM Core, direct HTTP and original WSP receipt:
          t09=proof['t09_direct_rpc_evidence']
          assert t09['status']=='T09_REAL_CORE_DIRECT_RPC_COMPONENT_PASS'
          assert t09['platform']=='macos-arm64'
          assert t09['genuine_busy_idle_recovery_checked'] is True
          assert t09['operational_wallet_checked'] is True
          assert t09['frozen_entrypoint'] is False
          assert t09['physical_accepted'] is False
          assert t09['mainnet_allowed'] is False
          assert proof['owned_startup_component']['status']=='REAL_CORE_OWNED_STARTUP_COLLISION_AND_PREAUTH_PASS'
          assert proof['owned_startup_component']['competing_listener_received_bytes']==0
          assert proof['wsp_bip352_e2e_pass'] is True
          assert proof['wsp_real_core_scan_pass'] is True
          actual = proof['wsp_live_scan']
          assert actual['status']=='REAL_WAM_CORE_WSP1_BIP352_CONFIRMED_RECEIVE_PASS'
          assert actual['real_core_rpc'] is True and actual['synthetic_rpc'] is False
          assert actual['actual_scanner_blocks_processed']==101
          assert actual['sqlite_restart_blocks_processed']==0
          assert actual['wsp_bip352_payment_confirmed'] is True
          assert actual['confirmed_demo_utxos']==1
          assert actual['confirmed_receive_atoms']>0
          assert actual['observed_height']==102
          assert actual['regtest_fixture_broadcast_confirmed'] is True
          assert proof['regtest_public_fixture_broadcast_confirmed'] is True
          assert proof['wallet_send_e2e_pass'] is True
          assert proof['gui_real_core_e2e_pass'] is True
          view = proof['gui_live_core_view']
          assert view['status']=='REAL_WAM_CORE_V0_1_11_NATIVE_QT_RECEIVE_BALANCE_HISTORY_PASS'
          assert view['real_core_rpc'] is True and view['synthetic_rpc'] is False
          assert view['qt_gui_rendered'] is True
          assert view['confirmed_balance_atoms']==actual['confirmed_receive_atoms']
          assert view['confirmed_history_txid']==actual['public_fixture_payment_txid']
          assert view['observed_height']==102
          assert view['native_wsp_sqlite_synced'] is True
          assert view['gui_background_worker_completed'] is True
          assert view['signer_allowed'] is False and view['broadcast_allowed'] is False
          assert view['mainnet_allowed'] is False
          assert actual['verified_tip']==proof['gui_live_core_view']['verified_tip']
          assert proof['mainnet_allowed'] is False
          security = proof['security_live_core']
          assert security['status'] == 'REAL_CORE_MACOS_KEYCHAIN_ENCRYPTED_RECOVERY_REORG_PASS'
          assert security['real_core_rpc'] is True and security['synthetic_rpc'] is False
          assert security['independent_native_keychain_anchor'] is True
          assert security['wallet_directory_rollback_denied'] is True
          assert security['wrong_password_denied'] is True
          assert security['stale_writer_denied'] is True
          assert security['native_wallet_id_lease_contended'] is True
          assert security['separate_process_lease_contended'] is True
          assert security['killed_process_lease_released'] is True
          assert security['failed_restore_plaintext_cleaned'] is True
          assert security['missing_or_replaced_keychain_anchor_denied'] is True
          assert security['unanchored_snapshot_retry_denied'] is True
          assert security['actual_core_reorg_depths'] == [1,12,100]
          assert security['restored_balance_blocked_until_live_scan'] is True
          assert security['actual_core_reorg_depth'] == 1 and security['observed_height'] == 103
          wallet = proof['wallet_live_core']
          assert wallet['status'] == 'REAL_CORE_NATIVE_QT_SEND_SIGN_BROADCAST_SECURITY_E2E_PASS'
          assert wallet['real_core_rpc'] is True and wallet['synthetic_rpc'] is False
          assert wallet['native_qt_prepare_sign_broadcast'] is True
          assert wallet['exact_intent_approval_required'] is True
          assert wallet['real_core_mempool_accepted'] is True
          assert wallet['real_core_confirmed_recipient_atoms'] == 100000
          assert wallet['native_sender_change_confirmed'] is True
          assert wallet['encrypted_reservations_before_network'] is True
          assert wallet['irreversible_anchor_before_native_crypto'] is True
          assert wallet['sign_broadcast_os_lease_held'] is True
          assert wallet['real_core_lost_broadcast_reply_lock_retained'] is True
          assert wallet['uncertain_reservation_survives_unlock'] is True
          assert wallet['irreversible_reservations_survive_reorg'] is True
          assert wallet['native_qt_backup_lock_recovery'] is True
          assert wallet['authenticated_selected_local_disclosure'] is True
          assert wallet['native_psbtv2_payjoin_bip352_fail_closed'] is True
          assert wallet['payjoin_signing_authorized'] is False
          assert wallet['payjoin_transport_implemented'] is False
          assert wallet['local_network_privacy_diagnostics'] is True
          assert wallet['background_sync_active'] is True
          assert wallet['background_sync_timer_live_core_verified'] is True
          assert wallet['background_sync_production_interval_ms'] == 30000
          assert wallet['qt_manual_light_dark_verified'] is True
          assert wallet['cross_session_key_recovery'] is True and wallet['cross_session_native_qt'] is True
          reopen = wallet['cross_session_recovery_proof']
          assert reopen['status'] == 'REAL_CORE_CROSS_SESSION_KEYCHAIN_BACKUP_REOPEN_PASS'
          assert reopen['real_core_rpc'] is True and reopen['synthetic_rpc'] is False
          assert reopen['same_test_keys_recovered'] is True and reopen['old_reservations_retained'] is True
          assert reopen['observed_height'] == 103
          assert wallet['native_gui_navigation_pages'] == 7 and wallet['observed_height'] == 105
          assert proof['mining_account_component']['native_gui_depths'] == [99,100,101]
          assert proof['mining_account_component']['owned_http_matches_independent_cli'] is True
          assert proof['mining_account_component']['f01_real_core_unowned_miner_script_negative_denied'] is True
          assert proof['mining_account_component']['f01_all_miner_fees_core_owned_and_treasury_separate'] is True
          print('REAL_CORE_NATIVE_QT_SEND_SIGN_BROADCAST_SECURITY_PASS')
          print('REAL_CORE_KEYCHAIN_ENCRYPTED_RECOVERY_REORG_PASS')
          print('REAL_WAM_CORE_REGTEST_101_BLOCKS_PASS')
          print('REAL_WAM_CORE_NATIVE_WSP_SQLITE_SCAN_101_BLOCKS_AND_RESTART_PASS')
          print('REAL_WAM_CORE_NATIVE_BIP352_CONFIRMED_RECEIVE_SQLITE_PASS')
          print('REAL_WAM_CORE_NATIVE_QT_GUI_RECEIVE_BALANCE_HISTORY_PASS')
          PY
      - name: Upload only sanitized live-Core evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: real-core-regtest-${{ github.sha }}
          path: |
            real-core-evidence.json
            t05-real-core-evidence.json
            managed-spend-real-core-evidence.json
            source-subsidy-contract.json
            independent-wallet-security.json
            fusion-ui-review/
            real-regtest-gui-preview.png
            real-regtest-wallet-preview.png
            real-regtest-security-preview.png
          if-no-files-found: error
          retention-days: 14


  native-app-dmg:
    name: Signed real Core + bundled WSP .app/.dmg macOS ARM64 E2E
    needs: real-wamd
    runs-on: macos-15
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Immutable upstream WSP-1 source
        uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'
      - name: Require native Apple Silicon and official GPG verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          if ! command -v gpg >/dev/null 2>&1; then brew install gnupg; fi
      - name: Install GUI, pinned source and native frozen-app builder
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C wsp-upstream rev-parse HEAD)" = ac55f13423620252bdbf848c7e8a280c3b84721e
          python -m pip install --disable-pip-version-check -e '.[gui]' -e ./wsp-upstream 'pyinstaller==6.22.3'
          python -m pip check
      - name: Security and bundling contracts
        run: python -m unittest discover -s tests -v
      - name: Fetch and authenticate exact official v0.1.11 ARM64 Core
        run: python -m wam_regtest.release --platform macos-arm64 --destination core
      - name: Build actual native .app/.dmg and repeat REAL Core + WSP + Qt E2E inside app
        shell: bash
        env:
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/build_macos_bundle.sh
      - name: Upload real built Mac application, DMG, checksums and Qt screenshot
        uses: actions/upload-artifact@v4
        with:
          name: WAM-Fusion-REGTEST-RC1-macos-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            package-output/WAM-Privacy-Wallet-REGTEST-macOS-ARM64.app.zip
            package-output/WAM-Privacy-Wallet-REGTEST-macOS-ARM64.dmg
            package-output/SHA256SUMS.json
            package-output/BUILD_SOURCE_PROVENANCE.json
            package-output/INDEPENDENT-WALLET-SECURITY.json
            package-output/macos-packaged-wallet-evidence.json
            package-output/RELEASE_CANDIDATE_MANIFEST.json
            package-output/SHA256SUMS.txt
            package-output/OWNER_REGTEST_ACCEPTANCE.md
            package-output/DEV_WAM_REVIEW_HANDOFF.md
            fusion-ui-review/
            real-regtest-gui-preview.png
            real-regtest-wallet-preview.png
            real-regtest-security-preview.png
          if-no-files-found: error
          retention-days: 14
