name: Windows x64 native credential and encrypted vault qualification

on:
  pull_request:
    paths:
      - "src/wam_regtest/windows_checkpoint_anchor.py"
      - "tests/test_windows_checkpoint_anchor.py"
      - "src/wam_regtest/windows_private_storage.py"
      - "tests/test_windows_private_storage.py"
      - "src/wam_regtest/custody.py"
      - "src/wam_regtest/windows_core_transport.py"
      - "src/wam_regtest/windows_package_entry.py"
      - "scripts/build_windows_bundle.py"
      - "src/wam_regtest/release_candidate.py"
      - "src/wam_regtest/build_provenance.py"
      - "src/wam_regtest/core.py"
      - "src/wam_regtest/owned_start.py"
      - "src/wam_regtest/startup_probe.py"
      - "src/wam_regtest/mining_account.py"
      - "src/wam_regtest/mining_probe.py"
      - "src/wam_regtest/mining_read.py"
      - "src/wam_regtest/mining_gui.py"
      - "scripts/check_wam_subsidy_source.py"
      - "tests/source_contract/**"
      - "src/wam_regtest/json_rpc.py"
      - "src/wam_regtest/core_process.py"
      - "src/wam_regtest/owned_rpc_probe.py"
      - "src/wam_regtest/bip39_wallet.py"
      - "src/wam_regtest/v1_contracts.py"
      - "src/wam_regtest/acceptance_evidence.py"
      - "tests/test_v1*.py"
      - "tests/data/bip39_reference.json"
      - "src/wam_regtest/wallet_session.py"
      - "src/wam_regtest/wallet_probe.py"
      - "src/wam_regtest/reopen_probe.py"
      - "src/wam_regtest/operational_gui.py"
      - "src/wam_regtest/desktop.py"
      - "src/wam_regtest/fusion_ui.py"
      - "src/wam_regtest/fusion_pages.py"
      - "pyproject.toml"
      - "src/wam_regtest/desktop_probe.py"
      - "tests/test_fusion_design.py"
      - "tests/test_fusion_mining.py"
      - "tests/test_fusion_v2_widgets.py"
      - "src/wam_regtest/network_policy.py"
      - "src/wam_regtest/vault.py"
      - "src/wam_regtest/encrypted_storage.py"
      - "src/wam_regtest/windows_vault_probe.py"
      - "src/wam_regtest/windows_core_regtest_smoke.py"
      - "src/wam_regtest/windows_release_preflight.py"
      - ".github/workflows/windows-x64-credential-anchor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win64-native-credential-cas:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Native Windows platform only
        shell: pwsh
        run: |
          python -c "import os,platform,struct; assert os.name=='nt' and platform.machine().lower() in ('amd64','x86_64') and struct.calcsize('P')==8"
      - name: Install source code and run native Credential Manager CAS tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[gui]" -e ./wsp-upstream
          python -m pip check
          python scripts/check_wam_subsidy_source.py --output source-subsidy-contract.json
          if ($LASTEXITCODE -ne 0) { throw "PINNED_SOURCE_CONTRACT_REQUIRED_NOT_CORE_E2E" }
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p "test_v1*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "V1_NATIVE_COMPATIBILITY_CONTRACT_REQUIRED" }
          python -m unittest discover -s tests -p "test_fusion*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "FUSION_NATIVE_UI_CONTRACT_REQUIRED" }
          python -m unittest discover -s tests -p "test_windows_checkpoint_anchor.py" -v
          if ($LASTEXITCODE -ne 0) { throw "WIN_CHECKPOINT_CREDENTIAL_GATE_DENIED" }
          python -m unittest discover -s tests -p "test_windows_private_storage.py" -v
          if ($LASTEXITCODE -ne 0) { throw "WIN_PRIVATE_CUSTODY_GATE_DENIED" }
          Write-Output "WIN_CREDENTIAL_AND_PRIVATE_CUSTODY_NATIVE_TESTS_PASS_NO_WALLET_ACTIVATION"
      - name: Genuine signed Core BIP352 vault backup recovery and real reorgs
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import json, os, subprocess, tempfile, unittest
          from pathlib import Path
          from wam_regtest.release import _download_exact
          from wam_regtest.windows_release_preflight import ASSET, BINARY_SHA256
          from wam_regtest.windows_core_regtest_smoke import smoke_signed_windows_regtest
          assert subprocess.check_output(['git','-C','wsp-upstream','rev-parse','HEAD'],text=True).strip()=='ac55f13423620252bdbf848c7e8a280c3b84721e'
          contracts=unittest.defaultTestLoader.discover('tests',pattern='test_windows_*.py')
          result=unittest.TextTestRunner(verbosity=2).run(contracts)
          assert result.wasSuccessful() and not result.skipped, 'NATIVE_WIN_CONTRACT_REQUIRED'
          with tempfile.TemporaryDirectory(prefix='wam-win-vault-e2e-') as t:
              root=Path(t)
              for remote,name,limit in (
                  ('/SIGNING-KEY.asc','SIGNING-KEY.asc',32768),
                  ('/downloads/v0.1.11/SHA256SUMS','SHA256SUMS',131072),
                  ('/downloads/v0.1.11/SHA256SUMS.asc','SHA256SUMS.asc',16384),
                  ('/downloads/v0.1.11/'+ASSET,ASSET,320*1024*1024)):
                  _download_exact(remote,limit,root/name)
              proof=smoke_signed_windows_regtest(root/ASSET,root/'SIGNING-KEY.asc',
                  root/'SHA256SUMS',root/'SHA256SUMS.asc',consent=True,
                  wsp_source=Path('wsp-upstream').absolute(),confirm_public_fixture_payment=True,
                  qt_readonly_e2e=True,vault_e2e=True,timeout=150)
              assert proof['status']=='WIN64_REAL_CORE_CREDENTIAL_ENCRYPTED_VAULT_RECOVERY_REORG_PASS'
              assert proof['vault_receipt']['actual_core_reorg_depths']==[1,12,100]
              assert proof['vault_receipt']['synthetic_rpc'] is False
              assert proof['core_sha256']==BINARY_SHA256['wamd.exe'] and proof['cli_sha256']==BINARY_SHA256['wam-cli.exe']
              assert proof['sign_broadcast_authorized'] is False and proof['mainnet_allowed'] is False
              proof['source_head_sha']=os.environ['WAM_SOURCE_HEAD']
              proof['checkout_sha']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              Path('windows-vault-evidence.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
              print('NATIVE_WINDOWS_REAL_CORE_CREDENTIAL_ENCRYPTED_VAULT_RECOVERY_REORG_PASS')
      - name: Publish only sanitized qualification evidence (no keys or SQLite)
        uses: actions/upload-artifact@v4
        with:
          name: windows-vault-evidence-${{ github.sha }}
          path: |
            windows-vault-evidence.json
            source-subsidy-contract.json
          if-no-files-found: error
          retention-days: 14
      - name: Native operational Qt Prepare Review Sign Broadcast and recovery
        shell: python
        env:
          QT_QPA_PLATFORM: windows
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import json, os, tempfile
          from pathlib import Path
          from wam_regtest.release import _download_exact
          from wam_regtest.windows_release_preflight import ASSET, verify_signed_windows_archive
          from wam_regtest.windows_core_regtest_smoke import _staged_signed_binaries
          from wam_regtest.core import smoke_real_core
          from wam_regtest.desktop import shutdown_qt
          try:
              with tempfile.TemporaryDirectory(prefix='wam-win-wallet-e2e-') as t:
                  root=Path(t)
                  for remote,name,limit in (
                      ('/SIGNING-KEY.asc','SIGNING-KEY.asc',32768),
                      ('/downloads/v0.1.11/SHA256SUMS','SHA256SUMS',131072),
                      ('/downloads/v0.1.11/SHA256SUMS.asc','SHA256SUMS.asc',16384),
                      ('/downloads/v0.1.11/'+ASSET,ASSET,320*1024*1024)):
                      _download_exact(remote,limit,root/name)
                  receipt=verify_signed_windows_archive(root/ASSET,root/'SIGNING-KEY.asc',root/'SHA256SUMS',root/'SHA256SUMS.asc')
                  _staged_signed_binaries(root/ASSET,receipt,root/'core')
                  proof=smoke_real_core(root/'core',explicit_consent=True,
                      wsp_source=Path('wsp-upstream').absolute(),wsp_payment_e2e=True,
                      security_e2e=True,wallet_e2e=True)
                  assert proof['platform']=='windows-x64' and proof['block_height']==105
                  assert proof['wallet_live_core']['status']=='WIN64_REAL_CORE_NATIVE_QT_SEND_SIGN_BROADCAST_SECURITY_E2E_PASS'
                  assert proof['security_live_core']['actual_core_reorg_depths']==[1,12,100]
                  assert proof['wallet_live_core']['cross_session_recovery_proof']['status']=='REAL_CORE_CROSS_SESSION_CREDENTIAL_BACKUP_REOPEN_PASS'
                  assert proof['wallet_live_core']['real_core_lost_broadcast_reply_lock_retained'] is True
                  assert proof['wallet_live_core']['cross_session_recovery_proof']['stale_before_native_signature_denied'] is True
                  assert proof['wallet_live_core']['cross_session_recovery_proof']['stale_before_real_broadcast_denied'] is True
                  assert proof['mainnet_allowed'] is False
                  proof['source_head_sha']=os.environ['WAM_SOURCE_HEAD']
                  Path('windows-operational-wallet-evidence.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
                  print('WIN64_REAL_NATIVE_QT_SIGN_BROADCAST_RECOVERY_PASS')
          finally:shutdown_qt()
      - name: Publish only sanitized Windows operational evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-operational-wallet-evidence-${{ github.sha }}
          path: |
            windows-operational-wallet-evidence.json
            fusion-ui-review/
          if-no-files-found: error
          retention-days: 14
      - name: Exact-head native BIP352 vectors and scanner locks before freezing
        shell: python
        run: |
          import sys, unittest
          from pathlib import Path
          # The upstream devtools/ harness is repository-local, not packaged
          # by pip install -e ./wsp-upstream. Retain the exact WSP checkout
          # and never replace upstream security tests with mocks.
          wsp_root = Path('wsp-upstream').resolve(strict=True)
          if not (wsp_root / 'devtools' / 'errors.py').is_file():
              raise RuntimeError('WIN_WSP_PINNED_DEVTOOLS_REQUIRED')
          sys.path.insert(0, str(wsp_root))
          from devtools.errors import HarnessError
          assert Path(sys.modules['devtools.errors'].__file__).resolve().is_relative_to(wsp_root)
          for pattern in ('test_vectors.py','test_file_lock.py','test_scanner_wallet.py'):
              suite=unittest.defaultTestLoader.discover('wsp-upstream/tests',pattern=pattern)
              assert suite.countTestCases()>0
              if pattern=='test_vectors.py':assert suite.countTestCases()==28
              result=unittest.TextTestRunner(verbosity=2).run(suite)
              assert result.wasSuccessful() and not result.skipped
      - name: Build operational Windows exe and execute genuine packaged wallet
        shell: pwsh
        env:
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m pip install "pyinstaller==6.22.3" "Pillow==12.0.0"
          python scripts/build_windows_bundle.py
          if ($LASTEXITCODE -ne 0) { throw "WIN_FROZEN_REAL_WALLET_REQUIRED" }
      - name: Publish operational package only after source and frozen acceptance
        uses: actions/upload-artifact@v4
        with:
          name: WAM-Fusion-REGTEST-RC1-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: windows-package-output/
          if-no-files-found: error
          retention-days: 14
