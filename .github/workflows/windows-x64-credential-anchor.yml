name: Windows x64 native credential and encrypted vault qualification

on:
  pull_request:
    paths:
      - "src/wam_regtest/windows_checkpoint_anchor.py"
      - "tests/test_windows_checkpoint_anchor.py"
      - "src/wam_regtest/windows_private_storage.py"
      - "tests/test_windows_private_storage.py"
      - "src/wam_regtest/custody.py"
      - "src/wam_regtest/windows_core_transport.py"
      - "src/wam_regtest/windows_package_entry.py"
      - "scripts/build_windows_bundle.py"
      - "src/wam_regtest/release_candidate.py"
      - "src/wam_regtest/build_provenance.py"
      - "src/wam_regtest/core.py"
      - "src/wam_regtest/owned_start.py"
      - "src/wam_regtest/startup_probe.py"
      - "src/wam_regtest/mining_account.py"
      - "src/wam_regtest/mining_probe.py"
      - "src/wam_regtest/mining_read.py"
      - "src/wam_regtest/mining_gui.py"
      - "scripts/check_wam_subsidy_source.py"
      - "tests/source_contract/**"
      - "src/wam_regtest/json_rpc.py"
      - "src/wam_regtest/core_process.py"
      - "src/wam_regtest/owned_rpc_probe.py"
      - "src/wam_regtest/bip39_wallet.py"
      - "src/wam_regtest/v1_contracts.py"
      - "src/wam_regtest/acceptance_evidence.py"
      - "tests/test_v1*.py"
      - "scripts/issue45_a06_fresh_crash.py"
      - "scripts/ci_platform_release_gate.py"
      - "tests/data/bip39_reference.json"
      - "src/wam_regtest/wallet_session.py"
      - "src/wam_regtest/wallet_probe.py"
      - "src/wam_regtest/reopen_probe.py"
      - "src/wam_regtest/operational_gui.py"
      - "src/wam_regtest/managed_lifecycle_probe.py"
      - "src/wam_regtest/q05_artifact_gate.py"
      - "src/wam_regtest/managed_gui.py"
      - "src/wam_regtest/supervisor_client.py"
      - "src/wam_regtest/core_supervisor.py"
      - "src/wam_regtest/cli.py"
      - "tests/test_fusion_managed_gui.py"
      - "src/wam_regtest/desktop.py"
      - "src/wam_regtest/fusion_ui.py"
      - "src/wam_regtest/fusion_pages.py"
      - "pyproject.toml"
      - "src/wam_regtest/desktop_probe.py"
      - "tests/test_fusion_design.py"
      - "tests/test_fusion_mining.py"
      - "tests/test_fusion_v2_widgets.py"
      - "src/wam_regtest/network_policy.py"
      - "src/wam_regtest/vault.py"
      - "src/wam_regtest/encrypted_storage.py"
      - "src/wam_regtest/windows_vault_probe.py"
      - "src/wam_regtest/windows_core_regtest_smoke.py"
      - "src/wam_regtest/windows_release_preflight.py"
      - ".github/workflows/windows-x64-credential-anchor.yml"
  workflow_dispatch:

env:
  WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  WAM_CHECKOUT_SHA: ${{ github.sha }}

permissions:
  contents: read
  actions: read

jobs:
  win64-native-credential-cas:
    runs-on: windows-2022
    # Native suite (~19 min), build, then THREE independent frozen suites
    # (default/125%/150%, each bounded to 20 min). Keep every DPI gate.
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Native Windows platform only
        shell: pwsh
        run: |
          python -c "import os,platform,struct; assert os.name=='nt' and platform.machine().lower() in ('amd64','x86_64') and struct.calcsize('P')==8"
      - name: Install source code and run native Credential Manager CAS tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[gui]" -e ./wsp-upstream
          python -m pip check
          python scripts/check_wam_subsidy_source.py --output source-subsidy-contract.json
          if ($LASTEXITCODE -ne 0) { throw "PINNED_SOURCE_CONTRACT_REQUIRED_NOT_CORE_E2E" }
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p "test_v1*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "V1_NATIVE_COMPATIBILITY_CONTRACT_REQUIRED" }
          python -X faulthandler scripts/run_native_unittest.py --pattern "test_fusion*.py"
          if ($LASTEXITCODE -ne 0) { throw "FUSION_NATIVE_UI_CONTRACT_REQUIRED" }
          python -m unittest discover -s tests -p "test_windows_checkpoint_anchor.py" -v
          if ($LASTEXITCODE -ne 0) { throw "WIN_CHECKPOINT_CREDENTIAL_GATE_DENIED" }
          python -m unittest discover -s tests -p "test_windows_private_storage.py" -v
          if ($LASTEXITCODE -ne 0) { throw "WIN_PRIVATE_CUSTODY_GATE_DENIED" }
          Write-Output "WIN_CREDENTIAL_AND_PRIVATE_CUSTODY_NATIVE_TESTS_PASS_NO_WALLET_ACTIVATION"
      - name: Genuine signed Core BIP352 vault backup recovery and real reorgs
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import json, os, subprocess, tempfile, unittest
          from pathlib import Path
          from wam_regtest.release import _download_exact
          from wam_regtest.windows_release_preflight import ASSET, BINARY_SHA256
          from wam_regtest.windows_core_regtest_smoke import smoke_signed_windows_regtest
          assert subprocess.check_output(['git','-C','wsp-upstream','rev-parse','HEAD'],text=True).strip()=='ac55f13423620252bdbf848c7e8a280c3b84721e'
          contracts=unittest.defaultTestLoader.discover('tests',pattern='test_windows_*.py')
          result=unittest.TextTestRunner(verbosity=2).run(contracts)
          assert result.wasSuccessful() and not result.skipped, 'NATIVE_WIN_CONTRACT_REQUIRED'
          with tempfile.TemporaryDirectory(prefix='wam-win-vault-e2e-') as t:
              root=Path(t)
              for remote,name,limit in (
                  ('/SIGNING-KEY.asc','SIGNING-KEY.asc',32768),
                  ('/downloads/v0.1.11/SHA256SUMS','SHA256SUMS',131072),
                  ('/downloads/v0.1.11/SHA256SUMS.asc','SHA256SUMS.asc',16384),
                  ('/downloads/v0.1.11/'+ASSET,ASSET,320*1024*1024)):
                  _download_exact(remote,limit,root/name)
              proof=smoke_signed_windows_regtest(root/ASSET,root/'SIGNING-KEY.asc',
                  root/'SHA256SUMS',root/'SHA256SUMS.asc',consent=True,
                  wsp_source=Path('wsp-upstream').absolute(),confirm_public_fixture_payment=True,
                  qt_readonly_e2e=True,vault_e2e=True,timeout=150)
              assert proof['status']=='WIN64_REAL_CORE_CREDENTIAL_ENCRYPTED_VAULT_RECOVERY_REORG_PASS'
              assert proof['vault_receipt']['actual_core_reorg_depths']==[1,12,100]
              assert proof['vault_receipt']['synthetic_rpc'] is False
              assert proof['core_sha256']==BINARY_SHA256['wamd.exe'] and proof['cli_sha256']==BINARY_SHA256['wam-cli.exe']
              assert proof['sign_broadcast_authorized'] is False and proof['mainnet_allowed'] is False
              proof['source_head_sha']=os.environ['WAM_SOURCE_HEAD']
              proof['checkout_sha']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              Path('windows-vault-evidence.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
              print('NATIVE_WINDOWS_REAL_CORE_CREDENTIAL_ENCRYPTED_VAULT_RECOVERY_REORG_PASS')
      - name: Publish only sanitized qualification evidence (no keys or SQLite)
        uses: actions/upload-artifact@v4
        with:
          name: windows-vault-evidence-${{ github.sha }}
          path: |
            windows-vault-evidence.json
            source-subsidy-contract.json
          if-no-files-found: error
          retention-days: 14
      - name: Native operational Qt Prepare Review Sign Broadcast and recovery
        shell: python
        env:
          QT_QPA_PLATFORM: windows
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import json, os, tempfile, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd().resolve()))
          from wam_regtest.release import _download_exact
          from wam_regtest.windows_release_preflight import ASSET, verify_signed_windows_archive
          from wam_regtest.windows_core_regtest_smoke import _staged_signed_binaries
          from wam_regtest.core import smoke_real_core
          import importlib.util
          # GitHub shell: python stores this step in a temporary script path.
          # Load the checked-out T05 test by its explicit repository path.
          t05_path=Path.cwd()/'scripts'/'issue45_t05_real_core.py'
          t05_spec=importlib.util.spec_from_file_location('issue45_t05_real_core',t05_path)
          assert t05_spec is not None and t05_spec.loader is not None, 'T05_TEST_SOURCE_MISSING'
          t05_module=importlib.util.module_from_spec(t05_spec)
          t05_spec.loader.exec_module(t05_module)
          prove_t05=t05_module.prove
          from wam_regtest.desktop import shutdown_qt
          try:
              with tempfile.TemporaryDirectory(prefix='wam-win-wallet-e2e-') as t:
                  root=Path(t)
                  for remote,name,limit in (
                      ('/SIGNING-KEY.asc','SIGNING-KEY.asc',32768),
                      ('/downloads/v0.1.11/SHA256SUMS','SHA256SUMS',131072),
                      ('/downloads/v0.1.11/SHA256SUMS.asc','SHA256SUMS.asc',16384),
                      ('/downloads/v0.1.11/'+ASSET,ASSET,320*1024*1024)):
                      _download_exact(remote,limit,root/name)
                  receipt=verify_signed_windows_archive(root/ASSET,root/'SIGNING-KEY.asc',root/'SHA256SUMS',root/'SHA256SUMS.asc')
                  _staged_signed_binaries(root/ASSET,receipt,root/'core')
                  # Run the isolated K-04 Core fixture FIRST on Windows;
                  # fail fast without waiting for unrelated long WSP/reorg QA.
                  # K-04: Core's own backupwallet and restorewallet RPC
                  # run only against two disposable verified REGTEST daemons.
                  k04_path=Path.cwd()/'scripts'/'issue45_k04_sqlite_e2e.py'
                  k04_spec=importlib.util.spec_from_file_location(
                      'issue45_k04_real_core',k04_path)
                  assert k04_spec is not None and k04_spec.loader is not None
                  k04_module=importlib.util.module_from_spec(k04_spec)
                  k04_spec.loader.exec_module(k04_module)
                  k04=k04_module.prove(root/'core')
                  assert k04['status']=='K04_REAL_CORE_SQLITE_RESTORE_QUARANTINE_PASS'
                  assert k04['real_core_restorewallet_rpc'] is True
                  assert k04['duplicate_descriptor_identity_denied'] is True
                  assert all(k04[key] is True for key in (
                      'k06_genuine_core_descriptor_owner_isolation',
                      'k06_core_duplicate_owner_refused',
                      'k06_core_keys_not_reinterpreted_as_wsp'))
                  assert k04['source_immutable'] is True
                  assert k04['fusion_signer_authorized'] is False
                  assert k04['synthetic_rpc'] is False and k04['mainnet_allowed'] is False
                  Path('windows-k04-core-sqlite-evidence.json').write_text(
                      json.dumps(k04,sort_keys=True,indent=2)+'\n',encoding='utf-8')
                  # K-10 native Core source->target REGTEST restore in
                  # separate disposable datadirs. Never persist backup keys.
                  from scripts.issue45_k10_core_same_host_smoke import prove_same_host_disposable_transfer
                  k10=prove_same_host_disposable_transfer(
                      (root/'core').resolve(),authorized=True)
                  assert k10['status']=='K10_REAL_CORE_SQLITE_SAME_OS_QUARANTINE_PASS'
                  assert k10['actual_core_source_and_target_rpc_verified'] is True
                  assert k10['source_and_target_descriptor_public_identity_equal'] is True
                  assert k10['cross_os_physical_transfer_qualified'] is False
                  assert k10['signer_allowed'] is False and k10['broadcast_allowed'] is False
                  Path('windows-k10-core-same-os-evidence.json').write_text(
                      json.dumps(k10,sort_keys=True,indent=2)+'\n',encoding='utf-8')
                  proof=smoke_real_core(root/'core',explicit_consent=True,
                      wsp_source=Path('wsp-upstream').absolute(),wsp_payment_e2e=True,
                      security_e2e=True,wallet_e2e=True)
                  assert proof['platform']=='windows-x64' and proof['block_height']==105
                  assert proof['mining_account_component']['f01_real_core_unowned_miner_script_negative_denied'] is True
                  assert proof['mining_account_component']['f07_genuine_regtest_p2pkh_p2sh_validateaddress_parity'] is True
                  assert proof['mining_account_component']['f09_genuine_core_bounded_read_soak']['status']=='F09_GENUINE_CORE_BOUNDED_READ_SOAK_PASS'
                  assert proof['mining_account_component']['f09_genuine_core_bounded_read_soak']['budget_version']=='F09_V1_64_CYCLES_180S'
                  assert proof['mining_account_component']['f09_genuine_core_bounded_read_soak']['cycles_completed']==64
                  assert proof['mining_account_component']['f09_genuine_core_bounded_read_soak']['read_only_rpc_calls']==192
                  assert proof['mining_account_component']['f09_genuine_core_bounded_read_soak']['stable_tip'] is True
                  assert proof['mining_account_component']['f10_core_wallet_miner_coexistence']['status']=='F10_OWNED_CORE_MINING_AND_WALLET_READ_PASS'
                  assert proof['mining_account_component']['f10_core_wallet_miner_coexistence']['generated_blocks']==4
                  assert proof['mining_account_component']['f10_core_wallet_miner_coexistence']['longpoll_witnesses']==4
                  assert proof['mining_account_component']['f10_core_wallet_miner_coexistence']['wallet_reads_verified']==12
                  assert proof['mining_account_component']['f10_core_wallet_miner_coexistence']['original_core_config_unchanged'] is True
                  assert proof['mining_account_component']['f10_core_wallet_miner_coexistence']['no_node_restart_or_stop'] is True
                  assert proof['mining_account_component']['f10_core_wallet_miner_coexistence']['wallet_identity_continued'] is True
                  assert proof['mining_account_component']['f10_native_external_solo_miner_qualified'] is False
                  assert proof['mining_account_component']['f10_operator_rpcworkqueue_64_qualified'] is False
                  assert proof['mining_account_component']['f10_sunset_400001_miner_binary_qualified'] is False
                  assert proof['mining_account_component']['f09_genuine_core_bounded_read_soak']['no_core_mutations'] is True
                  assert proof['mining_account_component']['f09_long_hours_days_runtime_qualified'] is False
                  assert proof['mining_account_component']['f09_multi_node_peer_sync_qualified'] is False
                  assert proof['mining_account_component']['f07_mainnet_collision_public_fixture_network_refusal_regtest'] is True
                  assert proof['mining_account_component']['f07_native_mainnet_parser_runtime_qualified'] is False
                  assert proof['mining_account_component']['f01_all_miner_fees_core_owned_and_treasury_separate'] is True
                  assert proof['mining_account_component']['f02_real_core_immature_99_100_and_mature_101_verified'] is True
                  assert proof['mining_account_component']['f02_no_early_send_or_mempool_mutation'] is True
                  assert proof['mining_account_component']['f03_real_core_mempool_fee_and_vsize']['mempool_entry_relay_eligible'] is True
                  assert proof['mining_account_component']['f03_real_core_mempool_fee_and_vsize']['observed_fee_atoms'] == proof['mining_account_component']['fee_atoms']
                  assert proof['mining_account_component']['f03_target_seconds_from_pinned_consensus_source'] == 120
                  assert proof['mining_account_component']['f03_confirmation_time_guaranteed'] is False
                  assert proof['mining_account_component']['f03_native_core_one_atom_dust_send_refused_without_mutation'] is True
                  assert proof['mining_account_component']['f04_core_lock_proof_from_listlockunspent_and_gettxout'] is True
                  assert proof['mining_account_component']['f04_core_unlock_restored_only_eligibility_not_new_money'] is True
                  assert proof['mining_account_component']['f04_genuine_core_after_lock']['locked_core_atoms'] == proof['mining_account_component']['f04_genuine_core_before_lock']['available_atoms']
                  assert proof['mining_account_component']['f04_genuine_core_after_lock']['available_atoms'] == 0
                  assert [x['f02_core_maturity_witness']['depth'] for x in proof['mining_account_component']['maturity']] == [99,100,101]
                  assert [x['f02_core_maturity_witness']['wallet_send_allowed_by_maturity'] for x in proof['mining_account_component']['maturity']] == [False,False,True]
                  t09=proof['t09_direct_rpc_evidence']
                  assert t09['status']=='T09_REAL_CORE_DIRECT_RPC_COMPONENT_PASS'
                  assert t09['platform']=='windows-x64'
                  assert t09['genuine_busy_idle_recovery_checked'] is True
                  assert t09['operational_wallet_checked'] is True
                  assert t09['frozen_entrypoint'] is False
                  assert t09['physical_accepted'] is False
                  assert t09['mainnet_allowed'] is False
                  assert proof['wallet_live_core']['status']=='WIN64_REAL_CORE_NATIVE_QT_SEND_SIGN_BROADCAST_SECURITY_E2E_PASS'
                  assert proof['security_live_core']['actual_core_reorg_depths']==[1,12,100]
                  assert proof['wallet_live_core']['cross_session_recovery_proof']['status']=='REAL_CORE_CROSS_SESSION_CREDENTIAL_BACKUP_REOPEN_PASS'
                  assert proof['wallet_live_core']['real_core_lost_broadcast_reply_lock_retained'] is True
                  f06=proof['wallet_live_core']
                  assert f06['f06_exact_sqlite_lock_no_second_token_or_coin_control_spend'] is True
                  assert f06['f06_original_psbt_review_and_coins_strictly_bound'] is True
                  assert f06['f06_second_sign_refused_without_mutation'] is True
                  assert f06['f06_second_broadcast_refused_without_mutation'] is True
                  assert f06['f06_uncertain_broadcast_never_automatically_retried'] is True
                  f05=proof['wallet_live_core']
                  assert f05['f05_native_core_wsp_mempool_observation']=='mempool_observed'
                  assert f05['f05_native_core_wsp_confirmed_depth']==1
                  assert f05['f05_native_core_wsp_reorg_observation'] in ('reorged_mempool_observed','reorged_not_observed')
                  assert f05['f05_native_core_wsp_restored_depth']==1
                  assert f05['f05_native_core_uncertain_mempool_observation']=='uncertain_mempool_observed'
                  assert f05['f05_no_automatic_retry_or_reservation_release'] is True
                  assert f05['f05_unconfirmed_silent_incoming_detection_qualified'] is False
                  assert proof['wallet_live_core']['cross_session_recovery_proof']['stale_before_native_signature_denied'] is True
                  assert proof['wallet_live_core']['cross_session_recovery_proof']['stale_before_real_broadcast_denied'] is True
                  assert proof['mainnet_allowed'] is False
                  # T05 Q05: separate true-Core persistent chain restart,
                  # forced Core crash, independent GUI-client exit/reconnect.
                  # Not yet complete GUI/frozen Q05 qualification.
                  t05=prove_t05(root/'core',qt=True)
                  assert all(t05[k] is True for k in (
                      'clean_restart_same_tip','daemon_crash_recovery_same_tip',
                      'independent_gui_client_reopen_same_chain',
                      'disconnected_gui_client_core_survived',
                      'independent_qt_process_reopen_same_chain',
                      'actual_qt_process_killed_after_authenticated_ready',
                      'actual_qt_crash_reconnect_same_tip',
                      'persistent_datadir_reused','simultaneous_owner_denied'))
                  assert t05['full_gui_q05_qualified'] is False
                  Path('windows-t05-core-evidence.json').write_text(
                      json.dumps(t05,sort_keys=True,indent=2)+'\n',encoding='utf-8')
                  assert json.loads(Path('windows-t05-core-evidence.json').read_text(encoding='utf-8')) == t05
                  print('WINDOWS_T05_REAL_CORE_PERSISTENT_LIFECYCLE_PASS_NOT_GUI_Q05')
                  # K-03: native WAM Core/WSP BIP39 wallet with typed v4
                  # backup, exact Qt Sign/Broadcast and anchored reopen.
                  k03_path=Path.cwd()/'scripts'/'issue45_managed_spend_e2e.py'
                  k03_spec=importlib.util.spec_from_file_location(
                      'issue45_k03_real_core',k03_path)
                  assert k03_spec is not None and k03_spec.loader is not None
                  k03_module=importlib.util.module_from_spec(k03_spec)
                  k03_spec.loader.exec_module(k03_module)
                  k03=k03_module.prove(root/'core',
                      Path('wsp-upstream').absolute(),bip39=True)
                  assert k03['status']=='K03_BIP39_DURABLE_REAL_WSP_SPEND_E2E_PASS'
                  assert all(k03[k] is True for k in (
                      'k03_bip39_native_seed_to_signer',
                      'genuine_wsp_psbtv2_native_signature',
                      'exact_original_identity_after_close_reopen',
                      'signed_reservation_anchored_before_crypto',
                      'broadcast_reservation_persisted_before_rpc',
                      'actual_native_fusion_qt_send_sign_broadcast'))
                  assert k03['synthetic_rpc'] is False
                  assert k03['mainnet_allowed'] is False
                  Path('windows-k03-bip39-core-evidence.json').write_text(
                      json.dumps(k03,sort_keys=True,indent=2)+'\n',encoding='utf-8')
                  print('WINDOWS_K03_BIP39_NATIVE_CORE_SIGN_REOPEN_PASS')
                  proof['source_head_sha']=os.environ['WAM_SOURCE_HEAD']
                  Path('windows-operational-wallet-evidence.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
                  print('WIN64_REAL_NATIVE_QT_SIGN_BROADCAST_RECOVERY_PASS')
          finally:shutdown_qt()
      - name: Publish only sanitized Windows operational evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-operational-wallet-evidence-${{ github.sha }}
          path: |
            windows-operational-wallet-evidence.json
            windows-t05-core-evidence.json
            windows-k03-bip39-core-evidence.json
            windows-k04-core-sqlite-evidence.json
            windows-k10-core-same-os-evidence.json
            fusion-ui-review/
          if-no-files-found: error
          retention-days: 14
      - name: Exact-head native BIP352 vectors and scanner locks before freezing
        shell: python
        run: |
          import sys, unittest
          from pathlib import Path
          # The upstream devtools/ harness is repository-local, not packaged
          # by pip install -e ./wsp-upstream. Retain the exact WSP checkout
          # and never replace upstream security tests with mocks.
          wsp_root = Path('wsp-upstream').resolve(strict=True)
          if not (wsp_root / 'devtools' / 'errors.py').is_file():
              raise RuntimeError('WIN_WSP_PINNED_DEVTOOLS_REQUIRED')
          sys.path.insert(0, str(wsp_root))
          from devtools.errors import HarnessError
          assert Path(sys.modules['devtools.errors'].__file__).resolve().is_relative_to(wsp_root)
          for pattern in ('test_vectors.py','test_file_lock.py','test_scanner_wallet.py'):
              suite=unittest.defaultTestLoader.discover('wsp-upstream/tests',pattern=pattern)
              assert suite.countTestCases()>0
              if pattern=='test_vectors.py':assert suite.countTestCases()==28
              result=unittest.TextTestRunner(verbosity=2).run(suite)
              assert result.wasSuccessful() and not result.skipped
      - name: Build operational Windows exe and execute genuine packaged wallet
        shell: pwsh
        env:
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m pip install "pyinstaller==6.22.3" "Pillow==12.0.0"
          python scripts/build_windows_bundle.py
          if ($LASTEXITCODE -ne 0) { throw "WIN_FROZEN_REAL_WALLET_REQUIRED" }
      - name: Publish operational package only after source and frozen acceptance
        uses: actions/upload-artifact@v4
        with:
          name: WAM-Fusion-REGTEST-RC1-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: windows-package-output/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve redacted frozen failure sites without publishing private fixtures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-redacted-frozen-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            q05-failure-*.json
            windows-ui-scale-*/q05-failure-*.json
            windows-packaged-wallet-denied.json
            fusion-ui-review/q17-layout-failure-*.json
            windows-ui-scale-*/fusion-ui-review/q17-layout-failure-*.json
          if-no-files-found: warn
          retention-days: 14

  a06-core-crash:
    name: Historical A06 SIGKILL diagnostic (not A/B/C acceptance)
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Urriki1502/wam-silent-payments
          ref: ac55f13423620252bdbf848c7e8a280c3b84721e
          path: wsp-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install exact source closure
        run: |
          python -m pip install -e . -e ./wsp-upstream
          if ($LASTEXITCODE -ne 0) { throw "A06_DEPENDENCY_INSTALL_DENIED" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "A06_DEPENDENCY_CHECK_DENIED" }
      - name: Signed original Core pair and unchanged A06 gate
        shell: python
        run: |
          import subprocess, sys, tempfile
          from pathlib import Path
          from wam_regtest.release import _download_exact
          from wam_regtest.windows_release_preflight import ASSET, verify_signed_windows_archive
          from wam_regtest.windows_core_regtest_smoke import _staged_signed_binaries
          with tempfile.TemporaryDirectory(prefix='wam-a06-win-core-') as folder:
              root=Path(folder)
              for remote,name,limit in (
                  ('/SIGNING-KEY.asc','SIGNING-KEY.asc',32768),
                  ('/downloads/v0.1.11/SHA256SUMS','SHA256SUMS',131072),
                  ('/downloads/v0.1.11/SHA256SUMS.asc','SHA256SUMS.asc',16384),
                  ('/downloads/v0.1.11/'+ASSET,ASSET,320*1024*1024)):
                  _download_exact(remote,limit,root/name)
              receipt=verify_signed_windows_archive(root/ASSET,root/'SIGNING-KEY.asc',root/'SHA256SUMS',root/'SHA256SUMS.asc')
              _staged_signed_binaries(root/ASSET,receipt,root/'core')
              outcome=subprocess.run([sys.executable,'scripts/issue45_a06_fresh_crash.py',
                  '--core-dir',str((root/'core').resolve()),
                  '--wsp-source',str(Path('wsp-upstream').resolve()),
                  '--confirm-disposable-regtest','--output','windows-x64-a06-core-crash-evidence.json'],
                  creationflags=subprocess.CREATE_NO_WINDOW)
          recorded=subprocess.run([sys.executable,'scripts/ci_a06_observation.py',
              '--receipt','windows-x64-a06-core-crash-evidence.json',
              '--probe-exit',str(outcome.returncode),'--output','a06-historical-observation.json'])
          raise SystemExit(recorded.returncode)
      - name: Preserve unchanged A06 failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-a06-core-crash-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            windows-x64-a06-core-crash-evidence.json
            a06-historical-observation.json
          if-no-files-found: error
          retention-days: 14
  platform-release-gate:
    name: Recovery-aware release gate (windows-x64; A06-A/B/C mandatory)
    if: always()
    needs: [win64-native-credential-cas, a06-core-crash]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-operational-wallet-evidence-${{ github.sha }}
          path: a06-evidence/native
      - uses: actions/download-artifact@v4
        with:
          name: WAM-Fusion-REGTEST-RC1-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: a06-evidence/frozen
      - name: Require actual native and frozen A06-A/B/C evidence
        if: always()
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          WAM_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_platform_release_gate.py --platform windows-x64 --required-jobs '["win64-native-credential-cas", "a06-core-crash"]' --evidence-root a06-evidence --output platform-release-gate.json
      - name: Publish FAIL as well as PASS without promoting a release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-ci-release-gate-${{ github.event.pull_request.head.sha || github.sha }}
          path: platform-release-gate.json
          if-no-files-found: error
          retention-days: 14
