[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wam-privacy-wallet-regtest"
version = "0.1.0"
description = "Minimal real-WAM-Core-first macOS ARM64 REGTEST application"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "WAM Privacy Wallet contributors"}]
dependencies = ["mnemonic==0.21"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7", "qrcode==8.2"]

[project.scripts]
wam-regtest = "wam_regtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
